<!DOCTYPE html>
<html>
<head>
    <title>Driver Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: #007bff;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚕 Driver Registration</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register as Driver
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="{% url 'driver_login' %}">
            Driver Login
        </a>
    </div>

</div>

</body>
</html>
