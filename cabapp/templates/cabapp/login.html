<!DOCTYPE html>
<html>
<head>
    <title>Cab Booking Login</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#007bff,#00c6ff);
        }

        .login-box{
            width:400px;
            background:white;
            margin:100px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#007bff;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        p{
            text-align:center;
        }

        a{
            color:#007bff;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🚖 Online Cab Booking</h1>

    <h3 style="text-align:center;">User Login</h3>

    <form method="post">

        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username">

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password">

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New User?
        <a href="/register/">Create Account</a>
    </p>

</div>

</body>
</html>
