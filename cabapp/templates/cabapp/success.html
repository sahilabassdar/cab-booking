<!DOCTYPE html>
<html>
<head>
    <title>Booking Successful</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            text-align:center;
        }

        .box{
            width:600px;
            margin:100px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            color:green;
        }

        .status{
            color:#ff6600;
            font-size:22px;
            font-weight:bold;
        }

        a{
            text-decoration:none;
            padding:10px 20px;
            border-radius:5px;
            color:white;
        }

        .home{
            background:#007bff;
        }

        .logout{
            background:red;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>✅ Booking Request Submitted</h1>

    <h3>Your cab booking request has been received successfully.</h3>

    <p class="status">
        🚖 Searching for nearby drivers...
    </p>

    <p>
        Driver assignment is currently in progress.
    </p>

    <p>
        You will receive driver details shortly.
    </p>

    <p>
        Estimated Response Time: <b>2 - 5 Minutes</b>
    </p>

    <br>

    <a href="/" class="home">
        Dashboard
    </a>

    <a href="/logout/" class="logout">
        Logout
    </a>

</div>

</body>
</html>
