<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#28a745,#7bed9f);
        }

        .register-box{
            width:450px;
            background:white;
            margin:70px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#28a745;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#218838;
        }

        p{
            text-align:center;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h1>🚖 User Registration</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login/">Login Here</a>
    </p>

</div>

</body>
</html>
